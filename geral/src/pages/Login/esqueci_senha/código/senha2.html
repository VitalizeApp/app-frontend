        <p class="email-destino">userXXXXXX@gmail.com</p>

        <div class="input-container">
          <input type="text" class="number-group" maxlength="1" />

        <div class="re-send">

          <span class="timer">5:00</span>

        <div class="button-container">
          <a href="../nova_senha/senha3.html">
