<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="cadastro4.css"/>
  <script defer src="cadastro4.js"></script>
  <title>Vitalize - Nova Senha</title>
</head>
<body>
  <main>
    <section>
      <h1>Crie uma senha nova</h1>
      <hr class="divider"/>
      <p class="subtitle">
        Tenha certeza de criar uma senha única cumprindo todos os requisitos necessários:
      </p>

      <div class="input-container">
        <div class="input-group">
          <img src="/src/pages/Login/img/ChaveIcon.png" alt="Senha" class="input-icon" />
          <input
            type="text"
            id="new-password"
            placeholder="Insira sua nova senha"
          />
        </div>

        <div class="input-group">
          <img src="/src/pages/Login/img/CheckPaswordIcon.png" alt="Senha" class="input-icon" />
          <input
            type="text"
            id="confirm-password"
            placeholder="Digite novamente"
          />
        </div>

        <div id="senha-alerta" class="sticky-alert"></div>
      </div>

      <div class="requirements">
        <label><input type="checkbox" disabled id="req-length"> Mínimo de 8 caracteres</label>
        <label><input type="checkbox" disabled id="req-upper"> Pelo menos uma letra maiúscula</label>
        <label><input type="checkbox" disabled id="req-lower"> Pelo menos uma letra minúscula</label>
        <label><input type="checkbox" disabled id="req-number"> Pelo menos um número</label>
        <label><input type="checkbox" disabled id="req-special"> Pelo menos um caractere especial</label>
      </div>

      <div class="button-container">
        <a href="/src/pages/Login/conclusão/concluidoGOV.html">
          <button function="salvarsenha(document.getElementById('new-password').value)" class="conclude-button">Concluir</button>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
