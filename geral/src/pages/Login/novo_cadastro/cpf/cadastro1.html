<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="cadastro1.css" />
    <script src="/geral/src/pages/Login/novo_cadastro/cadastrocmp.js"></script>
    <script defer src="cadastro1.js"></script>
    <title>Vitalize - Cadastro</title>
  </head>
  <body>
    <main>
      <section>
        <h1>Primeiro seu CPF</h1>
        <hr class="divider" />
        <p>Para começar, primeiro digite o CPF que será atrelado à conta</p>

        
        <div class="input-group">
          <img
            src="/src/pages/Login/img/UserIcon.png"
            alt="User Icon"
            class="input-icon"
          />
          <input
            type="text"
            id="cpf"
            maxlength="14"
            placeholder="Insira seu CPF"
          />
        </div>

        
        <div id="cpf-error"></div>

       
        <div class="button-container">
          <a
            href="/src/pages/Login/novo_cadastro/email/cadastro2.html"
            class="continue-link disabled"
            tabindex="-1"
            aria-disabled="true"
          >
            <button function="salvarcpf()" type="button" class="continue-button" disabled>
              Prosseguir
              <img
                src="/src/pages/Login/img/NextIcon.png"
                alt="Prosseguir"
                class="button-arrow"
              />
            </button>
          </a>

          <a href="/src/pages/Login/principal/LoginMain.html" class="back-link">
            <button type="button" class="back-button">Voltar</button>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
