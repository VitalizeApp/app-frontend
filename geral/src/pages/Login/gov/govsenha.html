<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gov.br - Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rawline:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="govsenha.css">
    
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="../img/logogov.br.webp" alt="gov.br" class="logo">
            <div class="icons">
                <div class="icon"></div>
                <div class="icon"></div>
            </div>
        </div>

        <div class="login-box">
            <h2>Digite sua senha</h2>

            <div class="cpf-info">
                <p class="label">CPF</p>
                <p class="value">XXX.XXX.XXX-XX</p>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" placeholder="Digite sua senha atual">
                    <span class="toggle-password" onclick="togglePasswordVisibility()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                </div>
            </div>

            <div class="buttons-group">
                <a class="btn btn-cancel" href="govcpf.html">Cancelar</a>
                <a class="btn btn-enter" href="../conclusão/concluidoLogin.html">Entrar</a>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password svg');

            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                // Altera o ícone para "olho aberto" (se você tiver um SVG diferente)
                // toggleBtn.innerHTML = '<svg ... olho aberto ...</svg>';
            } else {
                passwordField.type = 'password';
                // Altera o ícone de volta para "olho fechado"
                // toggleBtn.innerHTML = '<svg ... olho fechado ...</svg>';
            }
        }
    </script>
</body>
</html>
