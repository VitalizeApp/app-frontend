<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="LoginPfamiliar.css" />
    <title>Vitalize - Login</title>
  </head>

  <body>
    <div id="voltar"></div>
    <h1 id="titulo">Dependentes</h1>
    <div id="containerLogin">
      <h1>Login</h1>

      <div>
        <img class="size2" id="user" src="/src/pages/Login/img/user.svg" alt="usuário" />
        <input class="caixacpf" id="cpf" type="text" maxlength="11" placeholder="Digite o CPF" />
      </div>
      
      <div id="password">
        <img class="size3" src="/src/pages/Login/img/key.svg" alt="cadeado" />
        <input type="password" id="caixasenha" placeholder="Digite a senha" />
        <button type="button" id="ciclo">
          <img class="size" id="olho" src="/src/pages/Login/img/visibility_off.svg" alt="Esconder"/>
        </button>
    
        <script src="LoginPfamiliar.js"></script>

      </div>

      <button id="entrar">Entrar</button>
      <div class="footerLogin">
        <div class="footer-group">
          <span>Recupere sua conta!</span>
          <a href="#">Esqueci a senha</a>
        </div>
        <div class="footer-group">
          <span>É novo por aqui?</span>
          <a href="#">Criar conta</a>
        </div>
      </div>
    </div>
  </body>
</html>
