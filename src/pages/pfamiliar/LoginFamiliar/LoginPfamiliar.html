<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="LoginPfamiliar.css" />
    <script src="LoginPfamiliar.js"></script>
    <title>Vitalize - Login</title>
  </head>
  <a class="voltar" href="/src/pages/pfamiliar/pfamiliar.html">
    <img class="icon" src="/src/pages/historico/imgsHistorico/voltar.png" alt="voltar">
  </a>
  <body>

    
    <div class="titulo">
      <h1 id="titulo">Dependentes</h1>
    </div>
    <div id="containerLogin">
      <h1>Login</h1>
      <div class="campoLogin">
        <img src="/src/pages/Login/img/user.svg" alt="Ícone de usuário" />
        <input
          id="cpf"
          type="text"
          placeholder="Digite o CPF"
          maxlength="14"
          minlength="14"
          required
        />
      </div>
      <div class="campoLogin">
        <img src="/src/pages/Login/img/key.svg" alt="Ícone de senha" />
        <input id="senha" type="password" placeholder="Digite a senha" required />
        <img
          id="toggleSenha"
          src="/src/pages/Login/img/visibility_on.svg"
          alt="Mostrar senha"
        />
      </div>
      <a href="/src/pages/pfamiliar/pfamiliardep.html" class="campoBotao">
        <p>Entrar</p>
      </a>
      <div class="footerLogin">
        <div class="senha-group">
          <span>Recupere a conta!</span>
          <a href="/src/pages/Login/telas/senha/cpf/senha1.html"
            >Esqueci a senha</a
          >
        </div>
        <div class="cadastro-group">
          <span>Ele é novo por aqui?</span>
          <a href="/src/pages/Login/telas/cadastro/cpf/cadastro1.html"
            >Crie a conta</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
