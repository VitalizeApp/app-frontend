<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="LoginMain.css" />
    <script src="LoginMain.js" defer></script>
    <title>Vitalize - Login</title>
  </head>
  <body>
    <div class="titulo">
      <h1 id="titulo">Bem-vindo!</h1>
    </div>
    <div id="containerLogin">
      <h1>Login</h1>

      <div class="campoLogin">
        <img src="/src/pages/Login/img/user.svg" alt="Ícone de usuário" />
        <input
          id="cpf"
          type="text"
          placeholder="Digite seu CPF"
          maxlength="14"
        />
      </div>
      <div id="cpf-error" class="sticky-error"></div>

      <div class="campoLogin">
        <img src="/src/pages/Login/img/key.svg" alt="Ícone de senha" />
        <input id="senha" type="password" placeholder="Digite sua senha" />
        <img
          id="toggleSenha"
          src="/src/pages/Login/img/visibility_on.svg"
          alt="Mostrar senha"
        />
      </div>

      <div class="campoBotao">
        <a>Entrar</a>
      </div>

      <div class="footerLogin">
        <div class="senha-group">
          <span>Recupere sua conta!</span>
          <a href="/src/pages/Login/esqueci_senha/cpf/senha1.html"
            >Esqueci a senha</a
          >
        </div>
        <div class="cadastro-group">
          <span>É novo por aqui?</span>
          <a href="/src/pages/Login/novo_cadastro/cpf/cadastro1.html"
            >Criar conta</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
