<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="senha1.css" />
    <script defer src="senha1.js"></script>
    <title>Vitalize - Esqueci a senha</title>
  </head>
  <body>
    <main>
      <section>
        <h1>Recupere sua conta</h1>
        <hr class="divider" />
        <p>Para começar, primeiro digite o CPF da conta que deseja acessar</p>

        <div class="input-group">
          <img
            src="/src/pages/Login/img/UserIcon.png"
            alt="User Icon"
            class="input-icon"
          />
          <input
            type="text"
            id="cpf"
            maxlength="14"
            placeholder="Insira seu CPF"
          />
        </div>

        <div class="button-container">
          <a
            href="/src/pages/Login/esqueci_senha/código/senha2.html"
            class="continue-link disabled"
            tabindex="-1"
            aria-disabled="true"
          >
            <button type="button" class="continue-button" disabled>
              Prosseguir
              <img
                src="/src/pages/Login/img/NextIcon.png"
                alt="Prosseguir"
                class="button-arrow"
              />
            </button>
          </a>

          <a href="/src/pages/Login/principal/LoginMain.html" class="back-link">
            <button type="button" class="back-button">Voltar</button>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
