<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="senha1.css" />
    <script src="senha1.js"></script>
    <title>Vitalize - Esqueci a senha</title>
  </head>
  <body>
    <main>
      <h1>Recupere sua conta</h1>
      <hr class="divider" />
      <p>Para começar, primeiro digite o CPF da conta que deseja acessar</p>

      <div class="input-group">
        <img src="./img/icone_usuario.png" alt="User Icon" class="input-icon" />
        <input type="text" id="cpf" maxlength="14" placeholder="Insira seu CPF" />
      </div>

      <button type="submit" class="continue-button">
        Prosseguir
        <img src="./img/icone_seta_prosseguir.png" alt="Prosseguir" class="button-arrow" />
      </button>
    </main>
  </body>
</html>
