<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="acessados.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Atestados Médicos</title>
</head>
<body>
    <main class="telaPrincipal telaDocumento">
        <header class="document-header">
            <a href="home.html" class="back-button-doc" aria-label="Voltar para Home">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1>Atestados Médicos</h1>
            <div class="header-spacer-doc"></div>
        </header>

        <section class="filtro-section">
            <label for="filtroAtestados">Ordenar por:</label>
            <select id="filtroAtestados" class="filtro-select">
                <option value="recentes">Mais Recentes (Emissão)</option>
                <option value="antigas">Mais Antigas (Emissão)</option>
                <option value="validade">Validade Próxima</option>
            </select>
        </section>

        <section id="listaAtestados" class="lista-documentos">
            <p class="loading-data">Carregando atestados...</p>
        </section>
    </main>
    <script src="acessados.js"></script>
</body>
</html>
