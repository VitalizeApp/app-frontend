<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Navegador de Saúde - Mapa</title>
    <link rel="stylesheet" href="mapa.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="mapScreen" class="screen active-screen">
        <header class="site-header">
            <div class="container header-content">
                <a id="resetMapButton" class="back-button" aria-label="Resetar Visualização" href="home.html">
                    <i class="fas fa-chevron-left"></i>
                </a>
                <div class="header-title">
                    <h1>Navegador de Saúde</h1>
                    <p>Encontre locais e procedimentos.</p>
                </div>
                <div class="header-spacer"></div>
            </div>
        </header>

        <div id="locationRequestPrompt" class="location-prompt">
            <div class="container">
                <p><strong>Permita sua Localização:</strong> Para encontrar serviços próximos, habilite o acesso à sua localização.</p>
                <button id="dismissLocationPrompt" class="button-dismiss-prompt">Entendido</button>
            </div>
        </div>

        <main class="container main-content">
            <div class="layout-grid">
                <div class="search-column">
                    <div class="card">
                        <div class="form-group">
                            <label for="mapSearchType">Buscar por:</label>
                            <select id="mapSearchType" class="search-type-select">
                                <option value="facility">Local de Saúde</option>
                                <option value="procedure">Procedimento</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="mapSearchTerm" id="mapSearchTermLabel">Nome do Local:</label>
                            <div class="search-input-wrapper">
                                <input type="text" id="mapSearchTerm" placeholder="Hospital, clínica..."/>
                                <button id="mapSearchButton" class="search-icon-button" aria-label="Buscar">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </div>
                        <div id="mapSearchResults" class="search-results-container">
                            </div>
                    </div>
                    <div class="card navigation-card">
                        <a href="agendamento.html" class="button button-navigation">
                            <i class="fas fa-calendar-check"></i> Agendar Consulta ou Exame
                        </a>
                    </div>
                </div>
                <div class="map-details-column">
                    <div class="card map-container-wrapper">
                        <div id="mapFrameContainer" class="map-container">
                             <p class="map-placeholder">Carregando mapa...</p>
                        </div>
                    </div>
                    <div id="mapFacilityDetails" class="card facility-details-container hidden">
                        </div>
                </div>
            </div>
        </main>
    </div>
    <script src="mapa.js"></script>
</body>
</html>
