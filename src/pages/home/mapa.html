<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Navegador de Saúde - Mapa</title>
    <link rel="stylesheet" href="mapa.css">
    <link rel="stylesheet" href="/Vitalizebootstrap/Vitalize.css">
    <script src="/src/pages/configuracoes/tema.js">
    </script>
</head>
<body>
    <div id="mapScreen" class="tela tela-ativa">
        <header class="cabecalho-site">
            <div class="container cabecalho-conteudo">
                <a href="home.html" class="document-back-button" aria-label="Voltar">
                    <i class="seta-voltar fa-chevron-left"></i>
                </a>
                <div class="cabecalho-titulo">
                    <h1>Navegador de Saúde</h1>
                    <p>Encontre locais e procedimentos.</p>
                </div>
                <div class="cabecalho-espacador"></div>
            </div>
        </header>

        <div id="locationRequestPrompt" class="aviso-localizacao">
            <div class="container">
                <p><strong>Permita sua Localização:</strong> Para encontrar serviços próximos, habilite o acesso à sua localização.</p>
                <button id="dismissLocationPrompt" class="botao-dispensar-aviso">Entendido</button>
            </div>
        </div>

        <main class="container conteudo-principal">
            <div class="grade-layout">
                <div class="coluna-busca">
                    <div class="cartao">
                        <div class="grupo-formulario">
                            <label for="mapSearchType">Buscar por:</label>
                            <select id="mapSearchType" class="seletor-tipo-busca">
                                <option value="facility">Local de Saúde</option>
                                <option value="procedure">Procedimento</option>
                            </select>
                        </div>
                        <div class="grupo-formulario">
                            <label for="mapSearchTerm" id="mapSearchTermLabel">Nome do Local:</label>
                            <div class="involucro-input-busca">
                                <input type="text" id="mapSearchTerm" placeholder="Hospital, clínica..."/>
                                <button id="mapSearchButton" class="botao-icone-busca" aria-label="Buscar">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </div>
                        <div id="mapSearchResults" class="conteiner-resultados-busca">
                            </div>
                    </div>
                    </div>
                <div class="coluna-mapa-detalhes">
                    <div class="cartao involucro-conteiner-mapa">
                        <div id="mapFrameContainer" class="conteiner-mapa">
                             <p class="marcador-mapa">Carregando mapa...</p>
                        </div>
                    </div>
                    <div id="mapFacilityDetails" class="cartao conteiner-detalhes-instalacao oculto">
                        </div>
                </div>
            </div>
        </main>
    </div>
    <script src="mapa.js"></script>
</body>
</html>
