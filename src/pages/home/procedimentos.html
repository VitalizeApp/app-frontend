<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="acessados.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Histórico de Procedimentos</title>
</head>
<body>
    <main class="telaPrincipal telaDocumento">
         <header class="document-header">
            <a href="home.html" class="back-button-doc" aria-label="Voltar para Home">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1>Histórico de Procedimentos</h1>
            <div class="header-spacer-doc"></div>
        </header>

        <section class="filtro-section">
            <label for="filtroProcedimentos">Ordenar por:</label>
            <select id="filtroProcedimentos" class="filtro-select">
                <option value="recentes">Mais Recentes</option>
                <option value="antigas">Mais Antigas</option>
                <option value="nomeAZ">Nome (A-Z)</option>
            </select>
        </section>

        <section id="listaProcedimentos" class="lista-documentos">
            <p class="loading-data">Carregando procedimentos...</p>
        </section>
    </main>
    <script src="acessados.js"></script>
</body>
</html>
