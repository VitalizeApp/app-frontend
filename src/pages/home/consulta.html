<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="consulta.css">
  <title>Marcar consulta</title>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="voltar" href="/src/pages/home/mapa.html">
        <img src="/src/pages/historico/imgsHistorico/voltar.png" alt="Voltar" />
      </a>
      <h2 id="titulo">Encontre o procedimento desejado</h2>
      <h5 id="subtitulo">Agora mesmo!</h5>
      <div class="search-container">
        <input
          type="text"
          id="search-input"
          placeholder="Procurar"
        />
        <button id="search-button">
          <img src="/src/pages/home/imgsHome/busca.png" alt="Buscar" />
        </button>
       
      </div>
    </header>
    <section class="agendamento">
      
      <section class="carrosel especialidades">
        <h3 class="h3">Especialidades</h3>
        <article class="carroselContainer">
          <div class="processo">
            <div class="dentroCrd">
              <div class="imgContainer">
                <img src="imgsHome/heart.png" alt="imagem de coração">
              </div>
              <p>Cardiologia</p>
            </div>
          </div>
          <div class="processo">
            <div class="dentroCrd">
              <div class="imgContainer">
                <img src="/src/pages/home/imgsHome/brain.png" alt="imagem de cérebro">
              </div>
              <p>Neurologia</p>
            </div>
          </div>
          <div class="processo">
            <div class="dentroCrd">
              <div class="imgContainer">
                <img src="imgsHome/heart.png" alt="imagem de dente">
              </div>
              <p>Odontologia</p>
            </div>
          </div>
        </article>
      </section>
      
      
      
      <section class="agendamentoOn">
        <h3 class="h3">Agendamento de exames </h3>
        <div class="exame">
          <div class="bola">
            <img src="imgsHome/prancheta.png" alt="prancheta">
          </div>
          <div class="textExame">
            <p>Glicemia em jejum</p>
          </div>
          <a href="agendar.html" id="agendar">Agendar</a>
        </div>
        <div class="exame">
          <div class="bola">
            <img src="imgsHome/prancheta.png" alt="prancheta">
          </div>
          <div class="textExame">
            <p>Perfil lipídico</p>
          </div>
          <a href="agendar.html" id="agendar">Agendar</a>
        </div>
        <div class="exame">
          <div class="bola">
            <img src="imgsHome/prancheta.png" alt="prancheta">
          </div>
          <div class="textExame">
            <p> Urina tipo I</p>
          </div>
          <a href="agendar.html" id="agendar">Agendar</a>
        </div>
      </section>
    </section>
  </main>
  
</body>
</html>
