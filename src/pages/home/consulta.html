<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador de Saúde - Agendamento</title>
    <link rel="stylesheet" href="mapa.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="appointmentScreen" class="screen active-screen">
        <header class="site-header">
            <div class="container header-content">
                 <a href="mapa.html" id="backToMapButton" class="back-button" aria-label="Voltar">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <div class="header-title">
                    <h1>Agendar Consulta</h1>
                    <p>Encontre especialistas e exames.</p>
                </div>
                 <div style="width: 40px;"></div> </div>
        </header>
        <main class="container main-content">
            <div class="card">
                <div class="form-group">
                    <label for="appointmentSearchTerm">Encontre o doutor, especialidade ou exame:</label>
                    <div class="search-input-wrapper">
                         <input type="text" id="appointmentSearchTerm" placeholder="Cardiologia, Dr. Silva, Raio-X..."/>
                         <button id="appointmentSearchButton" class="search-icon-button" aria-label="Buscar">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Especialidades</h2>
                <div id="specialtiesContainer" class="grid-container">
                    </div>
                <button class="button-view-all">Ver todas</button>
            </div>

            <div class="card">
                <h2>Agendamento de Exames</h2>
                <div id="examsContainer" class="list-container">
                    </div>
                 <button class="button-view-all">Ver todos</button>
            </div>
        </main>
    </div>

    <nav class="bottom-nav">
        <a href="mapa.html" id="navMapButton" class="nav-button" aria-label="Mapa e Locais">
            <i class="fas fa-home"></i>
            <span>Início</span>
        </a>
        <a href="agendamento.html" id="navAppointmentButton" class="nav-button active" aria-label="Agendar Consulta">
            <i class="fas fa-calendar-check"></i>
            <span>Agendar</span>
        </a>
        <a href="#" id="navRemindersButton" class="nav-button" aria-label="Lembretes">
            <i class="fas fa-bell"></i>
            <span>Lembretes</span>
        </a>
        <a href="#" id="navSettingsButton" class="nav-button" aria-label="Configurações">
            <i class="fas fa-cog"></i>
            <span>Ajustes</span>
        </a>
    </nav>
    <script src="consulta.js"></script>
</body>
</html>
