<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="remedio.css">
    <link rel="stylesheet" href="/Vitalizebootstrap/Vitalize.css">
    <script src="/src/pages/configuracoes/tema.js"></script>
    <title>Document</title>
</head>
<body class="tela gray-white">
    <a href="../../lembretes.html" class="voltar-botao white" aria-label="Voltar">
                <i class="seta-voltar fa-chevron-left"></i>
            </a>

    <h1>Remédio</h1>

    <section id="container">

      <div class="caixa">
        <img class="icon resize" src="remicon/nome.svg" draggable="false">
        <input type="text" class="gray-white-text" placeholder="Nome do Remédio">
      </div>
      <div class="caixa">
        <img class="icon resize" src="remicon/dosagem.svg" draggable="false"> 
        <input type="text" class="gray-white-text" placeholder="Frequência">
      </div>
      <div class="caixa">
        <img class="icon resize" src="remicon/frequencia.svg" draggable="false"> 
        <input type="number" class="gray-white-text" placeholder="Dosagem" max="100">
      </div>
    
    </section>

    <section id="container2">
      <section class="area">
        <div id="interruptor" class="toggle-switch" onclick="toggleInterruptor()">
         <div class="toggle-circle"></div>
        </div>
        <p class="white-text">Notificar</p>
      </section>

      <section class="area">
        <div id="anexararea" class="areanexar" onclick="toggleAnexar()">
          <img id="anexar" class="icon anexara" src="remicon/anexar.svg" draggable="false">
        </div>
        <p class="white-text">Anexar</p>
      </section>

      <script>
        function toggleInterruptor() {
        const toggle = document.getElementById("interruptor");
         toggle.classList.toggle("ativo");
        }

        function toggleAnexar() {
          const toggle = document.getElementById("anexararea")
          const toggle2 = document.getElementById("anexar")
          toggle.classList.toggle("anexarativo")
          toggle2.classList.toggle("anexarativo2")
          toggle.classList.toggle("blue")
        }
      </script>
    </section>

    <a id="pronto" class="blue" href="/src/pages/Lembretes/lembretes.html">
      <p id="salvar">Salvar</p>
      <img class="icon resize"src="remicon/salvar.svg">
    </a>

</body>
</html>
