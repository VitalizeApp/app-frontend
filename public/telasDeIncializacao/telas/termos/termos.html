<!DOCTYPE html>
<html lang="pt-BR" class="htmlTermos">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="termos.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    
    <title>Vitalize - Tour</title>
  </head>
  <body>
    <div class="background"></div>

    <p class="frase-topo">Sua privacidade importa!</p>

    <div class="checkbox-container">
      <label class="custom-checkbox">
        <input type="checkbox" class="termo-checkbox" />
        <strong><span class="checkmark"></span>
        Você afirma ter mais de 18 anos e possuir a capacidade legal para
        aceitar estes termos.</strong>
      </label>

      <label class="custom-checkbox">
        <input type="checkbox" class="termo-checkbox" />
        <strong><span class="checkmark"></span>
        Você autoriza o aplicativo Vitalize a coletar, armazenar e utilizar 
        seus dados pessoais sensíveis relacionados à saúde — incluindo histórico 
        médico, condições clínicas, registros de vacinação, consultas, exames e 
        procedimentos — em conformidade com a Lei Geral de Proteção de Dados 
        Pessoais (Lei nº 13.709/2018 - LGPD).</strong>
      </label>

      <label class="custom-checkbox">
        <input type="checkbox" class="termo-checkbox" />
        <strong><span class="checkmark"></span>
        Você está ciente que o Vitalize declara que todos os procedimentos e práticas adotados 
        seguem os princípios éticos definidos por conselho de ética 
        consultado durante o desenvolvimento do aplicativo, garantindo 
        o respeito à sua privacidade, dignidade e direitos fundamentais. </strong>
      </label>
    </div>

    <a
      id="btn-iniciarI"
      class="btn-iniciar"
      href="/src/pages/Login/principal/LoginMain.html"
      >Iniciar</a
    >

   
  </body>
  <script src="/public/telasDeIncializacao/telas/termos/termos.js"></script>
</html>
